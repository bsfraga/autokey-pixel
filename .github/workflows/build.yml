name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Testar e gerar .exe (Windows)
    runs-on: windows-latest
    permissions:
      contents: write # necessário apenas para publicar a release em tags v*
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Testes unitários
        run: pytest -q

      - name: Smoke test da interface (offscreen)
        env:
          QT_QPA_PLATFORM: offscreen
          APPDATA: ${{ runner.temp }}\appdata
        run: >
          python -c "from PySide6.QtWidgets import QApplication;
          app = QApplication([]);
          from autokey_pixel.ui.main_window import MainWindow;
          w = MainWindow(); w.show(); app.processEvents(); w.close(); print('UI ok')"

      - name: Gerar executável (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name AutoKeyPixel
          --collect-submodules keyboard
          run.py

      - name: Publicar artefato
        uses: actions/upload-artifact@v6
        with:
          name: AutoKeyPixel-windows
          path: dist/AutoKeyPixel.exe
          if-no-files-found: error

      - name: Criar release (somente em tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/AutoKeyPixel.exe --title "AutoKey Pixel ${{ github.ref_name }}" --generate-notes
